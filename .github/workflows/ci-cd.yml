name: Microservices CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the selected image tag to Kubernetes
        required: true
        default: false
        type: boolean
      image_tag:
        description: Immutable image tag to deploy
        required: true
        default: latest
        type: string

env:
  REGISTRY: ${{ secrets.DOCKER_REGISTRY }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python service
        run: python -m py_compile service-a/app.py
      - name: Validate Node service
        run: node --check service-b/index.js
      - name: Validate shell scripts
        run: bash -n scripts/build_and_push.sh scripts/deploy_k8s.sh tests/healthcheck_service_a.sh tests/healthcheck_service_b.sh
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
      - name: Validate Kubernetes YAML
        run: kubectl apply --dry-run=client -f k8s/

  build:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [service-a, service-b, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ matrix.service }}:latest

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == true
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Configure kubeconfig
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG_DATA" | base64 --decode > "$HOME/.kube/config"
      - name: Deploy immutable image tag
        run: ./scripts/deploy_k8s.sh "${REGISTRY}" "${{ inputs.image_tag }}"
